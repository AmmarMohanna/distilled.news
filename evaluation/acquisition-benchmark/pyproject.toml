[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "distilled-acquisition-benchmark"
version = "0.1.0"
description = "Reproducible acquisition-route benchmark for Distilled.news"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "httpcore==1.0.9",
  "zstandard==0.25.0",
  "PyYAML==6.0.3",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
]
sources = ["feedparser==6.0.14", "Telethon==1.46.0"]
extract = ["trafilatura==2.3.1"]
browser = ["playwright==1.65.2"]

[project.scripts]
distilled-bench = "bench.cli:main"

[tool.setuptools.packages.find]
include = ["bench*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["bench", "tests"]
