name = "lownoise-news"
main = "src/index.ts"
compatibility_date = "2026-06-16"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[browser]
binding = "BROWSER"

[[containers]]
class_name = "AuthenticatedBrowserContainer"
image = "./browser-container.Dockerfile"
image_build_context = "../.."
instance_type = "standard-1"
max_instances = 2

[[durable_objects.bindings]]
name = "AUTHENTICATED_BROWSER_CONTAINER"
class_name = "AuthenticatedBrowserContainer"

[[migrations]]
tag = "authenticated-browser-container-v1"
new_sqlite_classes = ["AuthenticatedBrowserContainer"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
PUBLIC_API_BASE_URL = "https://distilled.news"
PUBLIC_WEB_BASE_URL = "https://distilled.news"
CLOUDFLARE_ACCOUNT_ID = "37a6bb83b085bd6739426e7c2d4aeda8"
CLOUDFLARE_AI_GATEWAY_ID = "default"
OPENAI_MODEL = "gpt-4.1-mini"
DISTILLED_WEB_OPERATOR_ENABLED = "true"
DISTILLED_BROWSER_BACKEND = "cloudflare"
DISTILLED_BROWSER_PROVIDER = "cloudflare_container"
DISTILLED_LIVE_PUBLIC_ACQUISITION_SMOKE = "true"
DISTILLED_LIVE_OPENROUTER_MODEL = "openai/gpt-4.1-mini"
DISTILLED_LIVE_OPENROUTER_PROVIDER = "openai"
DISTILLED_LLM_MODE = "api"
DISTILLED_LLM_API_GATEWAY = "openrouter"
DISTILLED_MODEL_CALL_TIMEOUT_MS = "45000"
DISTILLED_RUN_SETTLEMENT_RESERVE_MS = "5000"
WEB_OPERATOR_RUNTIME_URL = "https://lownoise-news.distilled-news-dev.workers.dev"
EMAIL_FROM = "Distilled.news <noreply@distilled.news>"
APIFY_GOOGLE_NEWS_ACTOR_ID = "groupoject/google-news-scraper"
APIFY_X_ACTOR_ID = "kaitoeasyapi/twitter-x-data-tweet-scraper-pay-per-result-cheapest"
APIFY_LINKEDIN_COMPANY_ACTOR_ID = "harvestapi/linkedin-company-posts"
APIFY_LINKEDIN_PROFILE_ACTOR_ID = "harvestapi/linkedin-profile-posts"

[[d1_databases]]
binding = "DB"
database_name = "lownoise"
database_id = "07b3581a-6eec-4eec-907b-b0c44e4408ad"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RAW_ARCHIVE"
bucket_name = "lownoise-raw"

[[r2_buckets]]
binding = "AUTHENTICATED_SECRETS"
bucket_name = "lownoise-authenticated-secrets"

[[send_email]]
name = "EMAIL"

[[queues.producers]]
binding = "PROCESSING_QUEUE"
queue = "lownoise-processing"

[[queues.producers]]
binding = "WEB_OPERATOR_QUEUE"
queue = "distilled-web-operator"

[[queues.consumers]]
queue = "lownoise-processing"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 4
retry_delay = 60
dead_letter_queue = "lownoise-processing-dlq"

[[queues.consumers]]
queue = "distilled-web-operator"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 4
retry_delay = 60
dead_letter_queue = "distilled-web-operator-dlq"

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["* * * * *"]
