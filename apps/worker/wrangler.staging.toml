name = "distilled-news-staging"
account_id = "e32b564514d4f9b9e383b7dd30dbb026"
main = "src/staging.ts"
compatibility_date = "2026-10-05"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
preview_urls = false
routes = []

[vars]
STAGING_ASSETS_PREFIX = "staging-assets/905fe696899a08e0e9a0521efed549416f3f3fe7/"
PUBLIC_API_BASE_URL = "https://distilled-news-staging.distillednews-platform.workers.dev"
PUBLIC_WEB_BASE_URL = "https://distilled-news-staging.distillednews-platform.workers.dev"
CLOUDFLARE_IMAGE_ACCOUNT_ID = "e32b564514d4f9b9e383b7dd30dbb026"
MAIL_TRANSPORT = "OUTLOOK_GRAPH"
EMAIL_FROM = "Distilled.news <distilled.news@outlook.com>"
SOURCE_CONNECTORS_ENABLED = "true"
SOURCE_QUEUE_SCHEDULING_ENABLED = "true"
# Staging-only rollout; legacy deployments keep their existing review ownership.
V1_REVIEW_PREPARATION_ISOLATED = "true"
SOURCE_SHARED_PUBLIC_FETCH_ENABLED = "true"
SOURCE_FULL_ARTICLES_ENABLED = "true"
SOURCE_GOOGLE_RESOLUTION_ENABLED = "true"
SOURCE_LEGACY_POLLING_ENABLED = "false"
PRODUCT_FEEDS_ENABLED = "true"
BRIEFING_ENGINE = "v3"
# Verified R2 archival is bounded to five unpaid diagnostics per scheduled sweep.
STORAGE_MAINTENANCE_ENABLED = "true"
UNREAD_SUMMARY_ENABLED = "true"
BRIEFING_EDITOR_MODEL = "openai/gpt-4.1"
BRIEFING_VERIFIER_MODEL = "openai/gpt-4.1-mini"
SOURCE_RECOMMENDATIONS_ENABLED = "true"
SOURCE_DISCOVERY_MODEL = "openai/gpt-4.1"
SOURCE_ASSESSMENT_ENABLED = "true"
SOURCE_ASSESSMENT_MODEL = "openai/gpt-4.1-mini"
# Preserve native exact-article recovery and durable Zyte fallback.
# Unlimited collection retains accounting and uncertain-outcome retry fences.
SOURCE_NATIVE_EXECUTION_ENABLED = "true"
SOURCE_COLLECTION_BUDGET_MODE = "unlimited"
SOURCE_PER_PROVIDER_BUDGET_USD = "15"
SOURCE_OPERATION_CEILINGS_JSON = '{"twitterApiIo":0.01,"apify":0.25,"zyte":0.05}'
SOURCE_PROVIDER_BUDGETS_JSON = '{"x_twitterapi_io":15,"x_apify":15,"google_apify":0,"linkedin_apify":15,"zyte":15}'
SOURCE_EXECUTION_URL = "http://127.0.0.1:8790/v1/source-execution"
V1_DOWNSTREAM_ENABLED = "true"
V1_DOWNSTREAM_FEED_SOURCE_IDS = "staging-rss-source,staging-twitter-source"
V1_EDITORIAL_PLAN_ENABLED = "true"
# Retained V2 publication work keeps its original validation contract.
V1_PUBLICATION_VALIDATION_CONTRACT = "EVIDENCE_GROUNDED_V2"
V1_EDITORIAL_MODEL_POLICY = "SEMANTIC"
V1_EDITORIAL_RANKING_POLICY = "SEMANTIC"
V1_REAL_MODEL_REQUIRED = "true"
V1_SEMANTIC_STRONG_MODEL = "openai/gpt-4.1-mini"
V1_SEMANTIC_POLICY = "SEMANTIC"
V1_SALIENCE_POLICY = "DETERMINISTIC"
V1_SYNTHESIS_MODEL_ENABLED = "true"
DISTILLED_LLM_API_GATEWAY = "openrouter"
DISTILLED_LIVE_OPENROUTER_MODEL = "openai/gpt-4.1-mini"
V1_BROWSER_ACQUISITION_ENABLED = "false"
DISTILLED_WEB_OPERATOR_ENABLED = "false"
DISTILLED_LIVE_PUBLIC_ACQUISITION_SMOKE = "false"
DISTILLED_NEWS_PIPELINE_EVALUATION = "false"

[[d1_databases]]
binding = "DB"
database_name = "distilled-news-staging"
database_id = "ab259bfe-6029-4e20-8cb6-eea6b7a67459"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RAW_ARCHIVE"
bucket_name = "distilled-news-staging-raw"

[[queues.producers]]
binding = "PROCESSING_QUEUE"
queue = "distilled-news-staging-processing"

[[queues.consumers]]
queue = "distilled-news-staging-processing"
# Each asynchronous pipeline owns its consumer lifetime; model admission remains account-scoped.
max_batch_size = 1
max_batch_timeout = 1
max_retries = 5
dead_letter_queue = "distilled-news-staging-processing-dlq"

[[queues.producers]]
binding = "SOURCE_COLLECTION_QUEUE"
queue = "distilled-news-staging-collection"

[[queues.consumers]]
queue = "distilled-news-staging-collection"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 5
max_concurrency = 8
dead_letter_queue = "distilled-news-staging-collection-dlq"

[[queues.producers]]
binding = "V1_ACQUISITION_QUEUE"
queue = "distilled-news-staging-acquisition"

[[queues.consumers]]
queue = "distilled-news-staging-acquisition"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 5
dead_letter_queue = "distilled-news-staging-acquisition-dlq"

[[queues.producers]]
binding = "V1_PROCESSING_QUEUE"
queue = "distilled-news-staging-v1"

[[queues.consumers]]
queue = "distilled-news-staging-v1"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 5
dead_letter_queue = "distilled-news-staging-v1-dlq"

[[vpc_services]]
binding = "SOURCE_EXECUTION_SERVICE"
service_id = "01a1099d-e88a-7c23-a1c5-eeb51471e780"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

# Keep the live staging asset binding; R2 remains the historical asset fallback.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
