name: Security - Semgrep CE
on:
  pull_request:
  push:
    branches: [main, ghada/DevSecOps, ghada/devsecops-security-automation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-semgrep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.185.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create full severity report (CE, no account)
        run: >-
          semgrep scan
          --config p/default --config p/security-audit
          --metrics off
          --exclude node_modules --exclude .local-reports
          --sarif --output semgrep.sarif
          apps packages scripts evaluation .github/workflows
      - name: Gate high-confidence ERROR findings
        run: >-
          semgrep scan
          --config p/default --config p/security-audit
          --metrics off
          --exclude node_modules --exclude .local-reports
          --severity ERROR --error
          apps packages scripts evaluation .github/workflows
      - name: Upload Semgrep SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep-ce
      - name: Preserve reviewable findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 7
