name: Briefing evaluation

on:
  push:
    paths:
      - 'evaluation/briefing-quality/**'
      - 'packages/briefing/**'
      - 'scripts/export-acquired-benchmark*'
      - 'pnpm-lock.yaml'
      - '.github/workflows/briefing-evaluation.yml'
  pull_request:
    paths:
      - 'evaluation/briefing-quality/**'
      - 'packages/briefing/**'
      - 'scripts/export-acquired-benchmark*'
      - 'pnpm-lock.yaml'
      - '.github/workflows/briefing-evaluation.yml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: briefing-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Offline evaluation checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - name: Run offline evaluation
        run: python evaluation/briefing-quality/continuous.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: briefing-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: evaluation/briefing-quality/reports/continuous/
          if-no-files-found: warn
          retention-days: 30
