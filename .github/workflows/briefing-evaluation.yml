name: Briefing evaluation

on:
  push:
    paths:
      - 'evaluation/briefing-quality/**'
      - 'packages/briefing/**'
      - 'scripts/export-acquired-benchmark*'
      - 'pnpm-lock.yaml'
      - '.github/workflows/briefing-evaluation.yml'
  pull_request:
    paths:
      - 'evaluation/briefing-quality/**'
      - 'packages/briefing/**'
      - 'scripts/export-acquired-benchmark*'
      - 'pnpm-lock.yaml'
      - '.github/workflows/briefing-evaluation.yml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: briefing-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Offline evaluation checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - name: Run offline evaluation
        run: python evaluation/briefing-quality/continuous.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briefing-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: evaluation/briefing-quality/reports/continuous/
          if-no-files-found: warn
          retention-days: 30
