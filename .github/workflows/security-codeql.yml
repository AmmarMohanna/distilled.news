name: Security - CodeQL
on:
  pull_request:
  push:
    branches: [main, ghada/DevSecOps, ghada/devsecops-security-automation]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize CodeQL security analysis
        uses: github/codeql-action/init@v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: none
      - name: Analyze source
        uses: github/codeql-action/analyze@v4.39.3
        with:
          category: /language:${{ matrix.language }}
