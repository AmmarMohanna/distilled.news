name: Acquisition benchmark offline tests
on:
  pull_request:
    paths:
      - evaluation/acquisition-benchmark/**
      - packages/connectors/src/**
      - .github/workflows/acquisition-benchmark.yml
  push:
    paths:
      - evaluation/acquisition-benchmark/**
      - packages/connectors/src/**
      - .github/workflows/acquisition-benchmark.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    defaults:
      run:
        working-directory: evaluation/acquisition-benchmark
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python -m pip install -c constraints.txt -e '.[dev,sources,extract]'
      - run: npm ci --prefix node --ignore-scripts --no-audit --no-fund
      - run: python -m pytest --junitxml=data/junit.xml
      - run: python -m bench faults --output data/faults.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-offline-${{ matrix.python }}
          path: evaluation/acquisition-benchmark/data/*.xml
