name: Public edge cost evidence

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type "measure public edge"
        type: string
        required: true

permissions:
  contents: read
  actions: read
  deployments: read

jobs:
  measure:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'measure public edge'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify protected GitHub deployment controls
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_GITHUB_ENVIRONMENT: staging
        run: node scripts/release/verify-github-protection.mjs
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify exact isolated staging resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/doctor.mjs --ci --deployment --environment staging
      - name: Measure public-edge request and D1 cost
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/distilled-public-edge"
          node scripts/load/public-edge-cost.mjs \
            > "$RUNNER_TEMP/distilled-public-edge/public-edge-cost.json"
      - name: Retain exact-SHA public-edge evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-edge-cost-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/distilled-public-edge/public-edge-cost.json
          if-no-files-found: error
          retention-days: 30
