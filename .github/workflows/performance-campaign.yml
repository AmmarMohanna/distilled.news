name: Opt-in local performance campaign
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Bounded synthetic fixture campaign (no live target)
        required: true
        type: choice
        options: [stress, soak, recovery, fault]
permissions:
  contents: read
concurrency:
  group: local-performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  campaign:
    environment: agentops-isolated-performance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENABLE_CAMPAIGN: 'yes'
      PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.3.0'
      - run: node evaluation/performance-reliability/k6/run-local.mjs "$PROFILE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentops-local-campaign-${{ github.sha }}
          path: .local-reports/k6/
          retention-days: 7
