name: Opt-in local performance campaign
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Bounded synthetic fixture campaign (no live target)
        required: true
        type: choice
        options: [stress, soak, recovery, fault]
permissions:
  contents: read
concurrency:
  group: local-performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  campaign:
    environment: agentops-isolated-performance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENABLE_CAMPAIGN: 'yes'
      PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1
        with:
          k6-version: '1.3.0'
      - run: node evaluation/performance-reliability/k6/run-local.mjs "$PROFILE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agentops-local-campaign-${{ github.sha }}
          path: .local-reports/k6/
          retention-days: 7
