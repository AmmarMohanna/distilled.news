name: Security - Trivy
on:
  pull_request:
  push:
    branches: [main, ghada/DevSecOps, ghada/devsecops-security-automation]
  schedule:
    - cron: '37 5 * * 2'
  workflow_dispatch:
    inputs:
      scan_container:
        description: 'Build and scan the real browser-container image (slow; no deployment)'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: security-trivy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  filesystem:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate full filesystem dependency and IaC SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: v0.76.2
          scanners: vuln,misconfig
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
          exit-code: '0'
      - name: Publish Trivy findings to code scanning
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem
      - name: Retain scan results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-filesystem-sarif
          path: trivy-fs.sarif
          retention-days: 7
      - name: Fail on high or critical dependency/configuration findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: v0.76.2
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
  browser-container-image:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_container == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build real browser container locally (do not push or deploy)
        run: docker build -f apps/worker/browser-container.Dockerfile -t distilled-browser-security:local .
      - name: Scan built container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: distilled-browser-security:local
          version: v0.76.2
          scanners: vuln,misconfig
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: sarif
          output: trivy-browser-image.sarif
          exit-code: '0'
      - name: Upload image SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-browser-image.sarif
          category: trivy-browser-image
      - name: Retain image findings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-browser-image-sarif
          path: trivy-browser-image.sarif
          retention-days: 7
      - name: Gate high/critical container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: distilled-browser-security:local
          version: v0.76.2
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
