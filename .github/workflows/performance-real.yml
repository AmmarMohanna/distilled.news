name: Manually approved isolated multi-user campaign
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-real-campaign
  cancel-in-progress: false
jobs:
  campaign:
    environment: agentops-multiuser-staging-approval
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify required environment reviewers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node evaluation/performance-reliability/real/verify-workflow.mjs
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1
        with:
          k6-version: '1.3.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: vars.CAMPAIGN_ADAPTER_KIND == 'native'
      - name: Install locked dependencies for native spending admission
        if: vars.CAMPAIGN_ADAPTER_KIND == 'native'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare private Gmail configuration
        if: vars.CAMPAIGN_ADAPTER_KIND == 'native'
        shell: bash
        env:
          GMAIL_CLIENT_JSON: ${{ secrets.CAMPAIGN_GMAIL_CLIENT_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.CAMPAIGN_GMAIL_TOKEN_JSON }}
        run: |
          set -eu
          umask 077
          test -n "$GMAIL_CLIENT_JSON"
          test -n "$GMAIL_TOKEN_JSON"
          directory="$(mktemp -d "$RUNNER_TEMP/campaign-gmail.XXXXXXXX")"
          chmod 700 "$directory"
          printf 'CAMPAIGN_GMAIL_DIRECTORY=%s\n' "$directory" >> "$GITHUB_ENV"
          printf '%s' "$GMAIL_CLIENT_JSON" > "$directory/gmail-client.json"
          printf '%s' "$GMAIL_TOKEN_JSON" > "$directory/gmail-token.json"
      - name: Run only the approved phase with private operator integrations
        env:
          CAMPAIGN_ARTIFACT_KEY: ${{ secrets.CAMPAIGN_ARTIFACT_KEY }}
          CAMPAIGN_PRIVATE_BUNDLE: ${{ secrets.CAMPAIGN_PRIVATE_BUNDLE }}
          CAMPAIGN_ADMIN_COOKIE: ${{ secrets.CAMPAIGN_ADMIN_COOKIE }}
          CAMPAIGN_EMAIL_DOMAIN: ${{ vars.CAMPAIGN_EMAIL_DOMAIN }}
          CAMPAIGN_PRIVATE_API_ORIGINS: ${{ vars.CAMPAIGN_PRIVATE_API_ORIGINS }}
          CAMPAIGN_MAILBOX_URL: ${{ vars.CAMPAIGN_MAILBOX_URL }}
          CAMPAIGN_CHALLENGE_URL: ${{ vars.CAMPAIGN_CHALLENGE_URL }}
          CAMPAIGN_ACCOUNTING_URL: ${{ vars.CAMPAIGN_ACCOUNTING_URL }}
          CAMPAIGN_ACCOUNT_ADMISSION_URL: ${{ vars.CAMPAIGN_ACCOUNT_ADMISSION_URL }}
          CAMPAIGN_BROWSER_EVIDENCE_URL: ${{ vars.CAMPAIGN_BROWSER_EVIDENCE_URL }}
          CAMPAIGN_PREFLIGHT_URL: ${{ vars.CAMPAIGN_PREFLIGHT_URL }}
          CAMPAIGN_PRIVATE_API_TOKEN: ${{ secrets.CAMPAIGN_PRIVATE_API_TOKEN }}
          CAMPAIGN_GRAFANA_OTLP_URL: ${{ vars.CAMPAIGN_GRAFANA_OTLP_URL }}
          CAMPAIGN_GRAFANA_AUTH: ${{ secrets.CAMPAIGN_GRAFANA_AUTH }}
          CAMPAIGN_ADAPTER_KIND: ${{ vars.CAMPAIGN_ADAPTER_KIND }}
          CAMPAIGN_QA_GMAIL: ${{ vars.CAMPAIGN_ADAPTER_KIND == 'native' && vars.CAMPAIGN_QA_GMAIL || '' }}
          CAMPAIGN_PILOT_WORKER: ${{ vars.CAMPAIGN_PILOT_WORKER }}
          CAMPAIGN_PROVIDER_ACCOUNT_ID: ${{ vars.CAMPAIGN_PROVIDER_ACCOUNT_ID }}
          CAMPAIGN_MAX_MODEL_OPERATIONS: ${{ vars.CAMPAIGN_MAX_MODEL_OPERATIONS }}
          CAMPAIGN_EXPECTED_BUNDLE_DIGEST: ${{ vars.CAMPAIGN_EXPECTED_BUNDLE_DIGEST }}
          CAMPAIGN_CLOUDFLARE_TOKEN: ${{ secrets.CAMPAIGN_CLOUDFLARE_TOKEN }}
        run: node evaluation/performance-reliability/real/workflow.mjs
      - name: Remove private Gmail files
        if: always()
        shell: bash
        run: |
          case "${CAMPAIGN_GMAIL_DIRECTORY:-}" in
            "$RUNNER_TEMP"/campaign-gmail.*) rm -rf -- "$CAMPAIGN_GMAIL_DIRECTORY" ;;
          esac
      - name: Encrypt private evidence before artifact storage
        if: always()
        env:
          CAMPAIGN_ARTIFACT_KEY: ${{ secrets.CAMPAIGN_ARTIFACT_KEY }}
        run: node evaluation/performance-reliability/real/seal-artifacts.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: encrypted-staging-campaign-${{ github.run_id }}
          path: .local-reports/campaign-evidence.encrypted.json
          retention-days: 3
      # Deliberately no raw-artifact upload: cookies, source text and private IDs
      # must not become broadly readable workflow artifacts.
