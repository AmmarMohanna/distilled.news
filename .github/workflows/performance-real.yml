name: Manually approved isolated multi-user campaign
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-real-campaign
  cancel-in-progress: false
jobs:
  campaign:
    environment: agentops-multiuser-staging-approval
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify required environment reviewers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node evaluation/performance-reliability/real/verify-workflow.mjs
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.3.0'
      - name: Run only the approved phase with private operator integrations
        env:
          CAMPAIGN_ARTIFACT_KEY: ${{ secrets.CAMPAIGN_ARTIFACT_KEY }}
          CAMPAIGN_PRIVATE_BUNDLE: ${{ secrets.CAMPAIGN_PRIVATE_BUNDLE }}
          CAMPAIGN_ADMIN_COOKIE: ${{ secrets.CAMPAIGN_ADMIN_COOKIE }}
          CAMPAIGN_EMAIL_DOMAIN: ${{ vars.CAMPAIGN_EMAIL_DOMAIN }}
          CAMPAIGN_PRIVATE_API_ORIGINS: ${{ vars.CAMPAIGN_PRIVATE_API_ORIGINS }}
          CAMPAIGN_MAILBOX_URL: ${{ vars.CAMPAIGN_MAILBOX_URL }}
          CAMPAIGN_CHALLENGE_URL: ${{ vars.CAMPAIGN_CHALLENGE_URL }}
          CAMPAIGN_ACCOUNTING_URL: ${{ vars.CAMPAIGN_ACCOUNTING_URL }}
          CAMPAIGN_ACCOUNT_ADMISSION_URL: ${{ vars.CAMPAIGN_ACCOUNT_ADMISSION_URL }}
          CAMPAIGN_BROWSER_EVIDENCE_URL: ${{ vars.CAMPAIGN_BROWSER_EVIDENCE_URL }}
          CAMPAIGN_PREFLIGHT_URL: ${{ vars.CAMPAIGN_PREFLIGHT_URL }}
          CAMPAIGN_PRIVATE_API_TOKEN: ${{ secrets.CAMPAIGN_PRIVATE_API_TOKEN }}
        run: node evaluation/performance-reliability/real/workflow.mjs
      - name: Encrypt private evidence before artifact storage
        if: always()
        env:
          CAMPAIGN_ARTIFACT_KEY: ${{ secrets.CAMPAIGN_ARTIFACT_KEY }}
        run: node evaluation/performance-reliability/real/seal-artifacts.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-staging-campaign-${{ github.run_id }}
          path: .local-reports/campaign-evidence.encrypted.json
          retention-days: 3
      # Deliberately no raw-artifact upload: cookies, source text and private IDs
      # must not become broadly readable workflow artifacts.
