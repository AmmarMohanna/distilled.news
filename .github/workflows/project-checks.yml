name: Project checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm -r typecheck
      - run: pnpm exec tsc -p tsconfig.e2e.json
      - run: node --test scripts/*.test.mjs
      - run: node --test evaluation/performance-reliability/*.test.mjs evaluation/performance-reliability/k6/*.test.mjs evaluation/performance-reliability/real/*.test.mjs
      - run: node scripts/validate-observability.mjs
      - run: python scripts/validate-wrangler-observability.py
      - run: python scripts/test_source_execution.py
      - run: pnpm -r --workspace-concurrency=1 --no-bail test
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/

  agentops-fixture-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.3.0'
      - run: node evaluation/performance-reliability/real/validate-k6.mjs
      - run: node evaluation/performance-reliability/k6/run-local.mjs smoke
      - run: node evaluation/performance-reliability/k6/run-local.mjs fault-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentops-fixture-performance-${{ github.sha }}
          path: .local-reports/k6/
          retention-days: 7

  agentops-fixture-campaigns:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        profile: [load, spike, stress, soak, recovery, fault]
    env:
      ENABLE_CAMPAIGN: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.3.0'
      - run: node evaluation/performance-reliability/k6/run-local.mjs "${{ matrix.profile }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-${{ matrix.profile }}-${{ github.sha }}
          path: .local-reports/k6/
          retention-days: 7

  agentops-correctness-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        group: [browser, v3, accounts]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        if: matrix.group == 'browser'
      - run: node evaluation/performance-reliability/run-correctness-fixtures.mjs "${{ matrix.group }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-${{ matrix.group }}-${{ github.sha }}
          path: .local-reports/agentops-fixtures/
          retention-days: 7
