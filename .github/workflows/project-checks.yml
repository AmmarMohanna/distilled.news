name: Project checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: pnpm install --frozen-lockfile
      - name: Configure HTTPS Ubuntu mirrors for browser dependencies
        run: sudo --preserve-env=GITHUB_ACTIONS python3 scripts/configure-ci-apt.py
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm -r typecheck
      - run: pnpm exec tsc -p tsconfig.e2e.json
      - run: node --test scripts/*.test.mjs
      - run: node --test evaluation/performance-reliability/*.test.mjs evaluation/performance-reliability/k6/*.test.mjs evaluation/performance-reliability/real/*.test.mjs
      - run: node scripts/validate-observability.mjs
      - run: python scripts/validate-wrangler-observability.py
      - run: python scripts/test_source_execution.py
      - run: pnpm -r --workspace-concurrency=1 --no-bail test
      - run: pnpm build

  browser:
    name: Browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure HTTPS Ubuntu mirrors for browser dependencies
        run: sudo --preserve-env=GITHUB_ACTIONS python3 scripts/configure-ci-apt.py
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec tsc -p tsconfig.e2e.json
      - run: pnpm --filter @distilled/web build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-results-${{ github.job }}
          path: |
            test-results/
            playwright-report/

  agentops-fixture-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1
        with:
          k6-version: '1.3.0'
      - run: node evaluation/performance-reliability/real/validate-k6.mjs
      - run: node evaluation/performance-reliability/k6/run-local.mjs smoke
      - run: node evaluation/performance-reliability/k6/run-local.mjs fault-proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: agentops-fixture-performance-${{ github.sha }}
          path: .local-reports/k6/
          retention-days: 7

  agentops-fixture-campaigns:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        profile: [load, spike, stress, soak, recovery, fault]
    env:
      ENABLE_CAMPAIGN: 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1
        with:
          k6-version: '1.3.0'
      - run: node evaluation/performance-reliability/k6/run-local.mjs "${{ matrix.profile }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fixture-${{ matrix.profile }}-${{ github.sha }}
          path: .local-reports/k6/
          retention-days: 7

  agentops-correctness-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        group: [browser, v3, accounts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure HTTPS Ubuntu mirrors for browser dependencies
        if: matrix.group == 'browser'
        run: sudo --preserve-env=GITHUB_ACTIONS python3 scripts/configure-ci-apt.py
      - run: pnpm exec playwright install --with-deps chromium
        if: matrix.group == 'browser'
      - run: node evaluation/performance-reliability/run-correctness-fixtures.mjs "${{ matrix.group }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: correctness-${{ matrix.group }}-${{ github.sha }}
          path: .local-reports/agentops-fixtures/
          retention-days: 7
