name: One-time isolated lockfile refresh
on:
  push:
    branches: [ghada/devsecops-security-automation]
    paths:
      - packages/connectors/package.json
      - .github/workflows/security-lockfile-refresh.yml
permissions:
  contents: write
jobs:
  update-lockfile:
    if: ${{ github.repository == 'AmmarMohanna/distilled.news' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ghada/devsecops-security-automation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate exact-version pnpm lockfile without scripts
        run: |
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          test -z "$(git diff --name-only -- . ':!pnpm-lock.yaml')"
          test "$(git diff --name-only)" = "pnpm-lock.yaml"
          git add pnpm-lock.yaml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): refresh pnpm lockfile for patched XML parser'
          git push origin HEAD:refs/heads/ghada/devsecops-security-automation
